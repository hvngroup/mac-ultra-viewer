name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  checks:
    name: Catalogs & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vietnamese and English catalogs match
        run: python3 scripts/check-localizations.py
      - name: Shell scripts parse
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Release notes exist for the current version
        run: |
          . ./version.conf
          if ! scripts/release-notes.sh "$APP_VERSION" > /dev/null 2>&1; then
            echo "::notice::CHANGELOG.md has no [$APP_VERSION] section yet; a release tag would be rejected."
          fi

  app:
    name: Test, package & verify
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Version
        run: |
          . ./version.conf
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ASSET=HVNUltraViewer-$APP_VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $APP_VERSION in version.conf" >&2
              exit 1
            fi
            scripts/release-notes.sh "$APP_VERSION" > "$RUNNER_TEMP/notes.md"
          fi

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: Unit tests
        run: swift test --parallel

      - name: Package universal app
        env:
          HVN_SIGNING_IDENTITY: "-"
          HVN_UNIVERSAL: "1"
        run: scripts/package-app.sh release

      - name: Import Developer ID certificate
        id: cert
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::notice::No Developer ID certificate configured; the release stays ad-hoc signed."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity found in the certificate." >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign with Developer ID (hardened runtime)
        if: steps.cert.outputs.identity != '' && steps.cert.outputs.identity != '-'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "${{ steps.cert.outputs.identity }}" "release/HVN UltraViewer.app"
          codesign --verify --deep --strict --verbose=2 "release/HVN UltraViewer.app"

      - name: Configure notarization
        id: notary
        if: steps.cert.outputs.identity != '' && steps.cert.outputs.identity != '-'
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Prefer an App Store Connect API key; fall back to Apple ID + app-specific password.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -n "$APPSTORE_API_KEY_P8" ] && [ -n "$APPSTORE_API_KEY_ID" ] && [ -n "$APPSTORE_API_ISSUER_ID" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$key_path"
            xcrun notarytool store-credentials hvn-notary --keychain "$keychain" \
              --key "$key_path" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID"
            rm -f "$key_path"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials hvn-notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          else
            echo "::notice::Notarization secrets missing; skipping notarization."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Notarize app
        if: steps.notary.outputs.enabled == 'true'
        run: |
          ditto -c -k --keepParent "release/HVN UltraViewer.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --keychain-profile hvn-notary \
            --keychain "$RUNNER_TEMP/signing.keychain-db" --wait --timeout 30m
          xcrun stapler staple "release/HVN UltraViewer.app"

      - name: Verify bundle
        run: scripts/verify-bundle.sh "release/HVN UltraViewer.app" arm64 x86_64

      - name: Disk image, zip and checksums
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARIZED: ${{ steps.notary.outputs.enabled }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "release/HVN UltraViewer.app" "release/$ASSET.zip"
          scripts/make-dmg.sh "release/HVN UltraViewer.app" "release/$ASSET.dmg"
          if [ -n "$IDENTITY" ] && [ "$IDENTITY" != "-" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "release/$ASSET.dmg"
            if [ "$NOTARIZED" = "true" ]; then
              xcrun notarytool submit "release/$ASSET.dmg" --keychain-profile hvn-notary \
                --keychain "$RUNNER_TEMP/signing.keychain-db" --wait --timeout 30m
              xcrun stapler staple "release/$ASSET.dmg"
            fi
          fi
          cd release
          for file in "$ASSET.zip" "$ASSET.dmg"; do shasum -a 256 "$file" > "$file.sha256"; done
          shasum -a 256 "$ASSET.zip" "$ASSET.dmg" > SHA256SUMS.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            release/${{ env.ASSET }}.dmg
            release/${{ env.ASSET }}.zip
            release/*.sha256
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            release/${{ env.ASSET }}.dmg
            release/${{ env.ASSET }}.zip
            release/*.sha256
            release/SHA256SUMS.txt

      - name: Remove signing keychain
        if: always() && steps.cert.outputs.identity != '' && steps.cert.outputs.identity != '-'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
